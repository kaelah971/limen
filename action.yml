name: Limen
description: Evaluate dependency-sensitive pull requests with repository facts, routed Telegraph evidence, and an explicit policy-backed release decision.
author: Limen
inputs:
  github-token:
    description: GitHub token used for read-only repository and pull request API access.
    required: true
  telegraph-private-key:
    description: Optional EVM private key for paid Telegraph CVE_LOOKUP requests.
    required: false
  max-lookups:
    description: Maximum number of unique paid CVE lookups for this run.
    required: false
    default: "5"
  telegraph-engine-url:
    description: Optional Telegraph Engine /v1/ask URL. Falls back to TELEGRAPH_ENGINE_URL.
    required: false
  expected-network:
    description: Optional x402 network. Falls back to TELEGRAPH_EXPECTED_NETWORK or Base Sepolia.
    required: false
  limen-api-url:
    description: "Optional Limen API base URL for OIDC-authenticated repository status reporting"
    required: false
  ledger-url:
    description: Optional Limen Evidence Ledger ingestion URL. Falls back to LIMEN_LEDGER_URL.
    required: false
  ledger-token:
    description: Optional machine-to-machine ledger ingest token. Falls back to LIMEN_LEDGER_TOKEN.
    required: false
  usage-class:
    description: "Ledger usage classification: production, demo, development, or test."
    required: false
    default: production
outputs:
  decision:
    description: "Overall Limen decision: PASS, HOLD, or REVIEW."
  run-id:
    description: Unique identifier for this in-memory release-check run.
  policy-version:
    description: Deterministic version of the policy loaded from the pull request base commit.
  decision-count:
    description: Number of canonical per-CVE Limen decisions.
  pass-count:
    description: Number of PASS decisions.
  hold-count:
    description: Number of HOLD decisions.
  review-count:
    description: Number of REVIEW decisions.
  evaluated-cves:
    description: JSON array of unique CVE IDs selected for evaluation.
  skipped-cves:
    description: JSON array of unique CVE IDs skipped after the lookup budget was reached.
  telegraph-request-count:
    description: Number of paid Telegraph lookup attempts made in this run.
  telegraph-cost-usd:
    description: Sum of reported Telegraph lookup costs in USD; blank when cost is unknown.
  reason:
    description: Run-level reason code.
  ledger-run-id:
    description: Stable Limen Evidence Ledger run ID when persistence succeeds.
  ledger-persisted:
    description: Whether the complete evidence package was recorded in the ledger.
runs:
  using: node24
  main: action/dist/index.js
branding:
  color: purple
  icon: git-merge
